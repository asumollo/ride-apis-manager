# Python tool settings

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated by Django
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes: unused imports, undefined names
  "I",   # isort: import ordering
  "B",   # bugbear: likely bugs (mutable defaults, etc.)
  "UP",  # pyupgrade: modern syntax for the target version
  "SIM", # simplify: needlessly complex expressions
  "TID", # tidy imports: no relative imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
# Also check functions that have no type hints yet
check_untyped_defs = true
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
