# Catches messy code and badly written commit messages
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Lint and format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Type checks with the Django and DRF plugins
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        entry: env DJANGO_DEBUG=1 mypy
        args: ["."]
        pass_filenames: false
        additional_dependencies:
          - Django==6.1.3
          - djangorestframework==3.18.3
          - django-filter==26.2
          - psycopg[binary]==3.3.8
          - python-dotenv==1.2.4
          - django-stubs==6.1.2
          - djangorestframework-stubs==3.18.2
          - types-django-filter==26.2.0.20261107

  - repo: local
    hooks:
      - id: conventional-commit
        name: flat conventional commit message
        language: python
        entry: python scripts/check_commit_msg.py
        stages: [commit-msg]
