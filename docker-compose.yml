services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rides
      POSTGRES_USER: rides
      POSTGRES_PASSWORD: rides
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "1"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
